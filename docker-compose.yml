# Closed Loop — the dashboard's container, plus an optional local LLM runtime.
#
#   docker compose up                          # dashboard + API only
#   docker compose --profile with-ollama up    # also run Ollama in a container
#
# Ollama defaults to the host (see .env.example): GPU passthrough is simpler
# there and the model cache survives image rebuilds. `--with-ollama` is for a
# machine with no host install.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Named explicitly — a Dockerfile's default target is its *last* stage,
      # and the `dev` stage sits at the bottom of this one.
      target: runtime
    image: closed-loop:latest
    pull_policy: build
    container_name: closed-loop
    ports:
      - "127.0.0.1:${CLOSED_LOOP_PORT:-8000}:8000"
    environment:
      # host.docker.internal resolves to the host via the extra_hosts entry
      # below; see .env.example for why this is the default rather than the
      # containerised `ollama` service.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Where the model picker writes the active model, and where the API
      # reads it. Mounted from the repo below, so a pinned choice is visible
      # in a diff and survives a rebuild.
      CLOSED_LOOP_CONFIG_DIR: /config
      # Low-resource tuning — see .env.example.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1024}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-2}
    volumes:
      - ./config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional: only starts with `--profile with-ollama`.
  ollama:
    profiles: ["with-ollama"]
    image: ollama/ollama:latest
    container_name: closed-loop-ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
