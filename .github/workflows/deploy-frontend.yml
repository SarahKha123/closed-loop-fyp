# Deploys the dashboard (frontend/) to S3 behind CloudFront, only when the repository owner starts it by hand:
# Actions → "Deploy frontend (AWS)" → Run workflow (branch: main). Independent of the backend deploy:
# CloudFront sends /api to the backend, so each side deploys on its own.
#
# Why nobody else can deploy: the jobs run only if the owner both started the run and (for a re-run) clicked
# re-run, and only on main. AWS access is the closed-loop-github-deploy role, which only trusts jobs in the
# "production" GitHub Environment, which only main may use.
name: Deploy frontend (AWS)

on:
  workflow_dispatch:

run-name: Deploy frontend for ${{ github.sha }}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-checks:
    name: Verify Closed Loop checks
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    steps:
      - name: Require successful checks for this commit
        run: |
          conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow checks.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "Closed Loop checks has not passed for commit $GITHUB_SHA (result: ${conclusion:-not found})." >&2
            echo "Push the commit to main, wait for Closed Loop checks to finish, then run this workflow again." >&2
            exit 1
          fi
          echo "Closed Loop checks passed for commit $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to S3 + CloudFront
    needs: [verify-checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # the OIDC token AWS trusts
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 12.9.1 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/closed-loop-github-deploy
          aws-region: ap-southeast-1
      - name: Upload to S3
        working-directory: frontend/dist
        run: |
          bucket="s3://closed-loop-web-${{ vars.AWS_ACCOUNT_ID }}"
          # Hashed files never change: cache for a year. Upload them first so the new index.html never points at
          # files that aren't there yet.
          aws s3 sync assets "$bucket/assets" --cache-control "public, max-age=31536000, immutable"
          # Everything else (index.html, icons) is checked on every load
          aws s3 sync . "$bucket" --exclude "assets/*" --cache-control "no-cache" --delete
          # Old hashed files go last, once nothing new points at them
          aws s3 sync assets "$bucket/assets" --cache-control "public, max-age=31536000, immutable" --delete
      - name: Refresh CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --id "$id"
          echo "Dashboard deployed for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
