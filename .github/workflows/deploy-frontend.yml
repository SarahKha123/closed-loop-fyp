# Deploys the dashboard (frontend/) to Vercel production, only when the repository owner starts it by hand:
# Actions → "Deploy frontend (Vercel)" → Run workflow (branch: main). Pushes and pull requests never deploy
# (frontend/vercel.json turns Vercel's git deployments off).
#
# Gates: "Closed Loop checks" passed for this exact commit, then the production environment's approval
# (if you set one). The frontend has no database, so unlike the backend it doesn't wait for migrations;
# Vercel forwards /api to the backend (frontend/vercel.json), so each side deploys on its own.
#
# Why nobody else can deploy: the jobs run only if the owner both started the run and (for a re-run)
# clicked re-run, and only on main; the Vercel secrets live in the "production" GitHub Environment.
name: Deploy frontend (Vercel)

on:
  workflow_dispatch:

run-name: Deploy frontend for ${{ github.sha }}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-checks:
    name: Verify Closed Loop checks
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    steps:
      - name: Require successful checks for this commit
        run: |
          conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow checks.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "Closed Loop checks has not passed for commit $GITHUB_SHA (result: ${conclusion:-not found})." >&2
            echo "Push the commit to main, wait for Closed Loop checks to finish, then run this workflow again." >&2
            exit 1
          fi
          echo "Closed Loop checks passed for commit $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to Vercel
    needs: [verify-checks]
    runs-on: ubuntu-latest
    environment:
      name: production # holds the secrets; only main may use it
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 12.9.1 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: npm install --global vercel@62.5.0
      # Run from the repo root: the Vercel project's Root Directory is frontend/
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      # Builds here on the runner, using frontend/vercel.json (pnpm install, pnpm build, dist/)
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to production: $url" >> "$GITHUB_STEP_SUMMARY"
