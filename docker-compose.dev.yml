# Development overlay — hot reload, in the container.
#
#   ./closed-loop.sh dev              # this file, layered over docker-compose.yml
#   ./closed-loop.sh dev --host       # two processes on the host instead
#
# In here, /config means the same thing it does in the shipped image, instead
# of being a path some shell function has to translate back to the repo.
# Ollama still runs on the host by default — GPU passthrough is simpler there
# and the model cache survives container rebuilds.

services:
  app:
    build:
      target: dev
    image: closed-loop:dev
    container_name: closed-loop-dev
    volumes:
      # Read-only: nothing in the app writes to its own package directory.
      - ./backend/app:/app/app:ro
    environment:
      CLOSED_LOOP_STATIC_DIR: /app/static-disabled
    # `!override` replaces the base file's ports instead of appending to it —
    # compose concatenates `ports`, and publishing both CLOSED_LOOP_PORT and
    # BACKEND_PORT fails when they're both 8000, which is the default.
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  # Vite, in its own container, proxying /api to the service above.
  frontend:
    image: node:24-slim
    container_name: closed-loop-frontend-dev
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm dev --host 0.0.0.0 --port 5173"
    environment:
      # What vite.config.ts's dev proxy points /api at — the service name,
      # which is what resolves inside this network.
      CLOSED_LOOP_API_URL: http://app:8000
    volumes:
      # Named individually rather than binding the whole repo root: this
      # project keeps the frontend at the repo root alongside backend/,
      # config/ and the reference-only Daedalus/ checkout, and none of those
      # belong in a container whose only job is running Vite.
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
      - ./tsconfig.node.json:/app/tsconfig.node.json
      # Named volumes so the container's own node_modules isn't shadowed by
      # the host's, and survives container recreation.
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  frontend-node-modules:
  frontend-pnpm-store:
